<meta charset="utf-8">
<title><!-- FILL:title -->Project Wireframe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Neutral wireframe: sidebar app shell, grey surfaces, one dark accent; yellow only for requirement tags. */
:root{--bg:#f3f3f1;--surface:#fff;--line:#d5d5d0;--ink:#2a2a28;--muted:#6f6f68;--fill:#e9e9e6;--accent:#3f4a52;--on-accent:#fff;
--ok:#e0eee0;--warn:#f5ead2;--bad:#f5dfdc;--req:#fff1b3;--req-ink:#5e4f00;--assume:#b08f00;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px;--s8:32px;--r:6px;--font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1e1f;--surface:#26282a;--line:#3d4043;--ink:#e6e6e3;--muted:#a3a39d;--fill:#323538;--accent:#a9bccb;--on-accent:#16191b;--ok:#24382a;--warn:#3d3420;--bad:#402a27;--req:#4a3f0e;--req-ink:#f3df87;--assume:#d8b93c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1e1f;--surface:#26282a;--line:#3d4043;--ink:#e6e6e3;--muted:#a3a39d;--fill:#323538;--accent:#a9bccb;--on-accent:#16191b;--ok:#24382a;--warn:#3d3420;--bad:#402a27;--req:#4a3f0e;--req-ink:#f3df87;--assume:#d8b93c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 var(--font);background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100%}
.sidebar{width:210px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:var(--s4);padding-left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--s2)}
.sidebar-logo{font-weight:600;padding-bottom:var(--s3);border-bottom:1px solid var(--line)}
.nav-item{display:block;padding:var(--s2) var(--s3);border-radius:var(--r);color:var(--ink);text-decoration:none;cursor:pointer}
.nav-item.active,.nav-item:hover{background:var(--fill)}
.sidebar-footer{margin-top:auto;font-size:12px;color:var(--muted)}
main{flex:1;min-width:0;padding-block:var(--s8);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px}
@media (min-width:700px){main{padding-left:var(--s8);padding-right:var(--s8)}}
@media (max-width:699px){.app{flex-direction:column}.sidebar{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}.sidebar-logo{border:0;padding:0;margin-right:var(--s3)}.sidebar-footer{display:none}}
.screen{display:none}.screen.active{display:block}
.page-header{display:flex;flex-wrap:wrap;gap:var(--s3);justify-content:space-between;align-items:center;margin-bottom:var(--s6)}
h1{font-size:22px;margin:0;text-wrap:balance}h2{font-size:16px;margin:0 0 var(--s3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s4)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s4)}
.stat{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}.label{color:var(--muted);font-size:12px;letter-spacing:.02em}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);font-variant-numeric:tabular-nums}th,td{text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line)}th{background:var(--fill);font-weight:600}
.btn{display:inline-block;padding:var(--s2) var(--s4);border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;font:inherit;text-decoration:none}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.nav-item:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s3)}
input,select,textarea{font:inherit;color:var(--ink);padding:var(--s2);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.badge{display:inline-block;padding:2px var(--s2);border-radius:99px;font-size:12px;background:var(--fill)}
.badge.ok{background:var(--ok)}.badge.warn{background:var(--warn)}.badge.bad{background:var(--bad)}
.notice{padding:var(--s3);border-radius:var(--r);background:var(--ok);margin-bottom:var(--s4)}
.placeholder{background:var(--fill);border:1px dashed var(--line);border-radius:var(--r);padding:var(--s6);text-align:center;color:var(--muted)}
.assumption{outline:2px dashed var(--assume);outline-offset:2px}
.req-tag{display:none;margin-left:var(--s2);padding:1px 6px;border-radius:4px;background:var(--req);color:var(--req-ink);font-size:11px;font-weight:600;vertical-align:middle}
body.show-req .req-tag{display:inline-block}
.toolbar{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
a{color:var(--ink)}
</style>
<div class="app">
<!-- FILL:sidebar — <aside class="sidebar"> with .sidebar-logo, one <a class="nav-item" href="#id" data-go="id"> per main screen, .sidebar-footer "Wireframe vN · date" -->
<main>
<!-- FILL:screens — one <section class="screen" id="id"> per screen in the screen map, then <section class="screen" id="coverage"> -->
</main>
</div>
<div class="toolbar"><label><input type="checkbox" id="req-toggle"> Show requirements</label> · <a href="#coverage" data-go="coverage">Coverage</a></div>
<script>
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
document.querySelectorAll('.sidebar .nav-item').forEach(a=>a.classList.toggle('active',a.dataset.go===id));try{history.replaceState(null,'','#'+id)}catch(e){}window.scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t){e.preventDefault();go(t.dataset.go)}});
document.addEventListener('submit',e=>e.preventDefault());
document.getElementById('req-toggle').addEventListener('change',e=>document.body.classList.toggle('show-req',e.target.checked));
const h=(location.hash||'').slice(1);go(document.getElementById(h)?h:document.querySelector('.screen').id);
</script>
