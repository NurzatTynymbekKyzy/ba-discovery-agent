# Token and cost budget for discovery-docs-update, checked by tools/evals/check_budget.py.
# A ceiling, not a target. To raise a number, do it in the pull request that
# needs it and explain what the extra tokens buy.

# Estimated tokens (characters / 3.6), checked free on every pull request.
# Set about 10% above the sizes measured on 2026-10-26, after the skill grew
# from requirements only to all five documents.
static:
  description: 140          # in context in every chat, triggered or not
  skill_md: 3000            # loaded when the skill runs
  references:
    references/docs-format.md: 1800   # read once, when proposing changes

# Per case, mean per run with the plugin loaded (judge calls excluded).
# Turns and cost: about 20% above the means of the 3-run suites on
# claude-sonnet-5-5, 2026-10-26. should-not-trigger runs longer because the
# request is handled by doc-analysis, which is part of the same plugin.
eval_model: claude-sonnet-5-5
eval:
  discovery-docs-update-clean:                          { max_cost_usd: 0.13, max_turns: 10 }
  discovery-docs-update-edge-conflict-vague-injection:  { max_cost_usd: 0.12, max_turns: 9 }
  discovery-docs-update-russian:                        { max_cost_usd: 0.12, max_turns: 9 }
  discovery-docs-update-canvas-settled:                 { max_cost_usd: 0.11, max_turns: 10 }
  discovery-docs-update-should-not-trigger:             { max_cost_usd: 0.14, max_turns: 9 }
