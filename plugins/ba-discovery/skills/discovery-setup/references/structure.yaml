# The Discovery workspace that `discovery-setup` creates on Google Drive.
# This file is the single source of truth: the skill creates exactly what is
# listed here, in this order, and nothing else.
#
# Types:
#   folder  - a Drive folder
#   doc     - a Google Doc,   built from its entry in references/templates.json
#   sheet   - a Google Sheet, built from its entry in references/templates.json
#
# `template` names the file in templates-source/discovery-setup/ (without its
# extension) that BAs edit; the build turns all of them into references/templates.json.
# `{project}` is replaced with the project name the BA gives.
# `key` is a stable identifier other skills use to find an item in
# _agent/discovery.yaml. Never change a key once released; rename `name` instead.

root:
  name: "{project} — Discovery"

items:
  - { key: readme,                type: doc,    name: "00 README", template: readme }

  - key: management
    type: folder
    name: "01 Discovery Management"
    items:
      - { key: discovery_plan,      type: sheet, name: "Discovery Plan",     template: discovery-plan }
      - { key: communication_plan,  type: sheet, name: "Communication Plan", template: communication-plan }
      - { key: access_checklist,    type: sheet, name: "Access Checklist",   template: access-checklist }
      - { key: raid_log,            type: sheet, name: "RAID Log",           template: raid-log }
      - { key: decision_log,        type: sheet, name: "Decision Log",       template: decision-log }

  - { key: client_inputs,         type: folder, name: "02 Client Inputs" }

  - key: meetings
    type: folder
    name: "03 Meetings"
    items:
      - { key: transcripts,         type: folder, name: "Transcripts" }
      - { key: meeting_summaries,   type: doc,    name: "Meeting Summaries", template: meeting-summaries }

  - key: stakeholders
    type: folder
    name: "04 Stakeholders"
    items:
      - { key: stakeholder_matrix,  type: sheet, name: "Stakeholder Matrix", template: stakeholder-matrix }

  - key: context
    type: folder
    name: "05 Context"
    items:
      - { key: context_canvas,      type: sheet, name: "Project Context Canvas", template: project-context-canvas }
      - { key: as_is_context,       type: doc,   name: "AS-IS Context",          template: as-is-context }
      - { key: glossary,            type: sheet, name: "Glossary",               template: glossary }

  - key: requirements
    type: folder
    name: "06 Requirements"
    items:
      - { key: requirements_register, type: sheet, name: "Requirements Register", template: requirements-register }
      - { key: open_questions_log,    type: sheet, name: "Open Questions Log",    template: open-questions-log }
      - { key: constraints,           type: doc,   name: "Constraints",           template: constraints }

  - { key: agent,                 type: folder, name: "_agent" }
