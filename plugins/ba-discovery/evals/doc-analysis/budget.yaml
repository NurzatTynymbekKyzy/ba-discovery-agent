# Token and cost budget for doc-analysis, checked by tools/evals/check_budget.py.
# A ceiling, not a target. To raise a number, do it in the pull request that
# needs it and explain what the extra tokens buy.

# Estimated tokens (characters / 3.6), checked free on every pull request.
# Set about 10% above the sizes measured on 2026-10-26.
static:
  description: 150          # in context in every chat, triggered or not
  skill_md: 3250            # loaded when the skill runs; raised from 3150 (2026-10-28) for the Sheets one-at-a-time rule
  references:
    references/analysis-format.md: 1300   # read once, when writing the analysis

# Per case, mean per run with the plugin loaded (judge calls excluded).
# Turns and cost: about 20% above the means of the 3-run suites on
# claude-sonnet-5-5, 2026-10-26. should-not-trigger runs longer because the
# request is handled by workshop-summary, which is part of the same plugin.
eval_model: claude-sonnet-5-5
eval:
  doc-analysis-clean:                       { max_cost_usd: 0.15, max_turns: 9 }
  doc-analysis-edge-contradiction-and-link: { max_cost_usd: 0.13, max_turns: 8 }
  doc-analysis-russian:                     { max_cost_usd: 0.15, max_turns: 8 }
  doc-analysis-should-not-trigger:          { max_cost_usd: 0.11, max_turns: 8 }
