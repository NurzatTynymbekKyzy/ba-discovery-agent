# Token and cost budget for prototype, checked by tools/evals/check_budget.py.
# A ceiling, not a target. To raise a number, do it in the pull request that
# needs it and explain what the extra tokens buy.

# Estimated tokens (characters / 3.6), checked free on every pull request.
# Set about 10% above the sizes measured on 2026-10-26.
static:
  description: 110          # in context in every chat, triggered or not
  skill_md: 2800            # loaded when the skill runs; raised from 2500 (2026-10-28) for the low-fi and UX self-checks
  references:
    references/prototype-format.md: 1400   # read once, at the first gate; raised from 1200 for states and UX notes
    references/ux-rules.md: 900            # read once, at the first gate: basic UX rules for the map and the screens
    references/wireframe-kit.html: 2500    # read once; low-fi greyscale kit with states, placeholders and UX notes (was 1850), dark theme and phone layout; only after the screen map is approved

# Per case, mean per run with the plugin loaded (judge calls excluded).
# Turns and cost: set about 20% above the means of the first 3-run suite.
eval_model: claude-sonnet-5-5
eval:
  prototype-screen-map:         { max_cost_usd: 0.12, max_turns: 10 }   # raised 2026-10-28: reads ux-rules.md
  prototype-build:              { max_cost_usd: 0.36, max_turns: 12 }   # raised 2026-10-28: low-fi screens with states and UX notes are longer to write
  prototype-update:             { max_cost_usd: 0.12, max_turns: 12 }
  prototype-should-not-trigger: { max_cost_usd: 0.12, max_turns: 9 }
