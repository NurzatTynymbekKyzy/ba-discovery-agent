# Token and cost budget for prototype, checked by tools/evals/check_budget.py.
# A ceiling, not a target. To raise a number, do it in the pull request that
# needs it and explain what the extra tokens buy.

# Estimated tokens (characters / 3.6), checked free on every pull request.
# Set about 10% above the sizes measured on 2026-10-26.
static:
  description: 110          # in context in every chat, triggered or not
  skill_md: 2500            # loaded when the skill runs
  references:
    references/prototype-format.md: 1200   # read once, at the first gate
    references/wireframe-kit.html: 1850    # read once; includes dark theme and phone layout, only after the screen map is approved

# Per case, mean per run with the plugin loaded (judge calls excluded).
# Turns and cost: set about 20% above the means of the first 3-run suite.
eval_model: claude-sonnet-5-5
eval:
  prototype-screen-map:         { max_cost_usd: 0.10, max_turns: 8 }
  prototype-build:              { max_cost_usd: 0.22, max_turns: 10 }
  prototype-update:             { max_cost_usd: 0.11, max_turns: 10 }
  prototype-should-not-trigger: { max_cost_usd: 0.12, max_turns: 9 }
