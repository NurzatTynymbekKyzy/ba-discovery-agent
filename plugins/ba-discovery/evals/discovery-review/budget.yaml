# Token and cost budget for discovery-review, checked by tools/evals/check_budget.py.
# A ceiling, not a target. To raise a number, do it in the pull request that
# needs it and explain what the extra tokens buy.

# Estimated tokens (characters / 3.6), checked free on every pull request.
# Set about 10% above the sizes measured on 2026-10-26.
static:
  description: 105
  skill_md: 2100
  references:
    references/checklist.md: 580   # read only in "Is it complete?", once

# Per case, mean per run with the plugin loaded (judge calls excluded).
# Turns and cost: set about 20% above the means of the first 3-run suite.
eval_model: claude-sonnet-5-5
eval:
  discovery-review-where-are-we:          { max_cost_usd: null, max_turns: 10 }
  discovery-review-complete-gaps:         { max_cost_usd: null, max_turns: 10 }
  discovery-review-complete-no-prototype: { max_cost_usd: null, max_turns: 10 }
  discovery-review-should-not-trigger:    { max_cost_usd: null, max_turns: 9 }
